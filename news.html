---
layout: default
title: News
news: true
permalink: /news/
description: "News from Junyeong Park."
---

<section class="news-page">
  <h1>News</h1>
  <ol class="timeline">
    {% for item in site.data.news %}
    <li class="timeline-item{% if forloop.first %} is-latest{% endif %}">
      <span class="rail" aria-hidden="true"><span class="node"></span></span>
      <time datetime="{{ item.date | replace: '.', '-' }}">{{ item.date }}</time>
      <div class="card">{{ item.text | markdownify }}</div>
    </li>
    {% endfor %}
  </ol>
</section>
